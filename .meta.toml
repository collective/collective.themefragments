# Generated from:
# https://github.com/plone/meta/tree/2.x/src/plone/meta/default
# See the inline comments on how to expand/tweak this configuration file
[meta]
template = "default"
commit-id = "2.12.0"

[gitignore]
extra_lines = """
.lock
.venv
htmlcov/
.mxdev_cache/
requirements.txt
"""

[pyproject]
# The fragment tile and the RichTextValue helper are optional: their ZCML is
# only loaded when plone.tiles or plone.app.textfield is installed. The tile
# requirements are declared in the `tiles` extra, which dependencychecker
# doesn't count for missing imports.
dependencies_ignores = "['zope.testrunner', 'plone.app.textfield', 'plone.app.blocks', 'plone.app.dexterity', 'plone.app.tiles', 'plone.app.vocabularies', 'plone.app.z3cform', 'plone.base', 'plone.supermodel', 'plone.tiles', 'plone.z3cform', 'z3c.caching', 'z3c.form']"

[tox]
test_matrix = {"6.2" = ["3.13", "3.12", "3.11", "3.10"], "6.1" = ["3.13", "3.12", "3.11", "3.10"]}
constraints_files = {"6.2" = "https://dist.plone.org/release/6.2.3/constraints.txt", "6.1" = "https://dist.plone.org/release/6.1-latest/constraints.txt"}

[github]
jobs = [
    "qa",
    "coverage",
    "release_ready",
    "circular",
    "dependencies",
    ]
